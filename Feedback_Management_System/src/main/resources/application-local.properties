spring.application.name=Feedback_Management_System

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/DBName 	//Database Name of PostgreSQL
spring.datasource.username=username 		// Username of PSQL
spring.datasource.password=password 		// Password of PSQL

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable open-in-view warning (good practice)
spring.jpa.open-in-view=false